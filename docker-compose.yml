---
services:
  abioticfactor:
    image: indifferentbroccoli/abiotic-factor-server-docker
    restart: unless-stopped
    container_name: abioticfactor
    stop_grace_period: 60s
    ports:
      - 7777:7777/udp
      - 27015:27015/udp
    env_file:
      - .env
    volumes:
      - ./server-files:/data/server-files
